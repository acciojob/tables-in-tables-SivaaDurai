
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table style="width:100%; height:370px;" border="1">
        <tr style="height:65%;">
            <td style="width:50%;">
                <table style="width:100%;" border="1">
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                    <tr>
                        <td style="text-align:center;">abc</td>
                        <td style="text-align:center;">def</td>
                    </tr>
                </table>
            </td>

            <td style="width:50%;">
                <table style="width:100%;" border="1">
                    <tr>
                        <th>Nested Table 1</th>
                    </tr>
                    <tr>
                        <td>
                            <ul>
                                <li>List item</li>
                                <li>List item</li>
                                <li>List item</li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height:35%;">
            <td>
                <table style="width:100%;" border="1">
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                    <tr>
                        <td style="text-align:center;">
                            <a href="#">Nested Table</a>
                        </td>
                        <td style="text-align:center;">Demo Continued</td>
                    </tr>
                </table>
            </td>

            <td>
                <table style="width:100%;" border="1">
                    <tr>
                        <th>Nested Table 4</th>
                    </tr>
                    <tr>
                        <th style="background-color:black; color:white;">
                            HTML
                        </th>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
